[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-analysis"
version = "0.1.0"
description = "Basic sales data analysis project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "plotly>=5.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
